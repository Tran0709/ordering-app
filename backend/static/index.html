<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>菜园子 Order Online</title>
<meta name="theme-color" content="#1f7a34">
<style>
:root{--g:#1f7a34;--gd:#145a25;--gold:#f3d27a;--ink:#1d1d1b;--mute:#6b6b66;--bg:#f6f4ee;--card:#fff;--line:#e6e2d6;--red:#c8281e}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}
img{display:block;max-width:100%}
/* header – green band like the printed menu */
header{position:sticky;top:0;z-index:20;background:linear-gradient(#24883b,var(--g));color:#fff;box-shadow:0 2px 8px #0003}
.top{display:flex;align-items:center;gap:16px;max-width:1240px;margin:auto;padding:10px 16px}
.logo{background:#fff;border-radius:8px;padding:4px 8px;height:48px;display:flex;align-items:center}
.logo img{height:40px;width:auto}
.slogan{flex:1;min-width:0}
.slogan b{display:block;color:var(--gold);font-size:20px;letter-spacing:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slogan span{font-family:Georgia,serif;font-size:13px;opacity:.9}
.cartbtn{background:var(--gold);color:var(--gd);border:0;border-radius:24px;padding:10px 16px;font-weight:700;display:flex;gap:8px;align-items:center;white-space:nowrap}
.cartbtn i{font-style:normal;background:var(--red);color:#fff;border-radius:12px;padding:0 7px;font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;max-width:1240px;margin:auto;padding:0 16px 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;color:#fff;text-decoration:none;font-size:14px;padding:6px 12px;border:1px solid #ffffff55;border-radius:16px}
nav a.on{background:#fff;color:var(--g)}
.bar{max-width:1240px;margin:12px auto 0;padding:0 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--mute)}
.toggle{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 12px;color:var(--ink)}
main{max-width:1240px;margin:auto;padding:0 16px 120px}
/* section banner like "菜园子拿手菜 Garden Signature Dish" */
.sec{scroll-margin-top:130px;margin-top:28px}
.banner{display:flex;justify-content:space-between;align-items:flex-end;background:linear-gradient(180deg,var(--g) 0 62%,#fff 100%);border-radius:6px 6px 0 0;padding:10px 16px 14px}
.banner h2{margin:0;font-size:28px;color:#fff;letter-spacing:3px;text-shadow:2px 2px 0 var(--gd),-1px -1px 0 #3aa152}
.banner em{font-family:Georgia,serif;font-style:normal;color:#fff;text-align:right;font-size:16px;text-shadow:1px 1px 2px #0006;max-width:50%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.card .ph{aspect-ratio:4/3;background:#ddd;position:relative}
.card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;left:8px;top:8px;background:radial-gradient(#fbe7a6,#d7a83d);color:#7a2a10;font-weight:800;font-size:12px;border-radius:50%;width:48px;height:48px;display:grid;place-items:center;text-align:center;line-height:1.1;border:2px solid #fff;box-shadow:0 1px 4px #0005}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.row{display:flex;justify-content:space-between;gap:8px}
.zh{font-weight:800;font-size:18px}
.en{font-family:Georgia,serif;font-size:12.5px;color:var(--mute)}
.price{text-align:right;line-height:1.1;white-space:nowrap}
.price .mp{font-family:Georgia,serif;font-weight:700;font-size:19px}
.price small{display:block;font-size:10px;font-weight:700;color:var(--mute)}
.price .up{font-family:Georgia,serif;font-size:14px;margin-top:4px}
.price.member .up{color:var(--mute)} .price:not(.member) .mp{color:var(--mute);font-size:15px}
.price:not(.member) .up{font-weight:700;font-size:19px;color:var(--ink)}
.opts{display:flex;gap:6px}
.opts button{flex:1;border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px;font-size:13px}
.opts button.on{border-color:var(--g);background:#e8f3ea;color:var(--g);font-weight:700}
.add{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.add .note{font-size:12px;color:var(--mute)}
.plus{background:var(--g);color:#fff;border:0;border-radius:20px;padding:7px 14px;font-weight:700}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--g);background:#fff;color:var(--g);font-weight:800}
/* hero (signature) */
.hero{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-top:4px}
.hero .card .ph{aspect-ratio:16/9}
.hero .zh{font-size:24px}
/* drinks table like the printed beverages box */
.drinks{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:4px}
.dcol{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px}
.dcol h3{margin:0 0 8px;text-align:center;color:var(--g)}
.drow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line)}
.drow img{width:44px;height:44px;object-fit:contain;border-radius:4px;background:#f3f3f3}
.drow .t{flex:1;min-width:0}.drow .t b{display:block;font-size:15px}
.drow .p{font-family:Georgia,serif;font-weight:700}
/* drawer */
.scrim{position:fixed;inset:0;background:#0006;z-index:40;display:none}
.drawer{position:fixed;z-index:50;background:#fff;display:flex;flex-direction:column;transition:transform .25s;right:0;top:0;bottom:0;width:420px;max-width:100%;transform:translateX(100%)}
.open .scrim{display:block}.open .drawer{transform:none}
.dh{background:var(--g);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.dh h3{margin:0}.dh button{background:none;border:0;color:#fff;font-size:24px}
.db{flex:1;overflow:auto;padding:12px 16px}
.df{border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.line{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line img{width:56px;height:56px;object-fit:cover;border-radius:6px}
.line .t{flex:1;min-width:0;font-size:14px}.line .t b{display:block}
.sum{display:flex;justify-content:space-between;font-size:14px;margin:4px 0}.sum.tot{font-size:18px;font-weight:800}
.big{width:100%;background:var(--g);color:#fff;border:0;border-radius:8px;padding:14px;font-size:16px;font-weight:700;margin-top:8px}
.big:disabled{opacity:.5}
.ghost{background:#fff;color:var(--g);border:1px solid var(--g)}
fieldset{border:0;padding:0;margin:0 0 16px}
legend{font-weight:800;margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pick{border:1.5px solid var(--line);border-radius:8px;padding:10px;background:#fff;text-align:left;display:flex;gap:10px;align-items:center}
.pick.on{border-color:var(--g);background:#eef7f0}
.pick .ic{width:36px;height:24px;border-radius:4px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex:none}
.seg .pick{justify-content:center;text-align:center}
.pays{display:grid;gap:6px}
label.f{display:block;font-size:13px;margin:8px 0 4px;color:var(--mute)}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:12px;color:var(--mute);margin-top:6px}
.qr{width:180px;height:180px;margin:10px auto;display:block;border:8px solid #fff;outline:2px solid #7b2d8e;border-radius:6px}
.err{color:var(--red);font-size:13px;margin-top:6px}
.hours{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 12px;color:var(--ink)}
.pill{font-weight:800;font-size:12px;padding:2px 10px;border-radius:12px;color:#fff;background:var(--g)}.pill.closed{background:var(--red)}
.closedmsg{background:#fdecea;color:var(--red);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:8px}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.ok{text-align:center;padding:20px 0}.ok .tick{font-size:56px;color:var(--g)}
footer{background:var(--g);color:#fff;text-align:center;padding:24px 16px 100px;font-size:14px}
footer b{color:var(--gold)}
.fab{display:none}
@media (max-width:720px){
  .slogan{display:none}.top{justify-content:space-between}
  .cartbtn{display:none}
  .fab{display:flex;position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;justify-content:space-between;align-items:center;background:var(--g);color:#fff;border:0;border-radius:28px;padding:14px 20px;font-weight:700;box-shadow:0 4px 16px #0004}
  .fab.hide{display:none}
  .hero{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .zh{font-size:15px}.en{font-size:11px}.price .mp,.price:not(.member) .up{font-size:16px}
  .info{padding:8px}.row{flex-direction:column;gap:4px}.price{text-align:left;display:flex;gap:10px;align-items:baseline}
  .price .up{margin:0}
  .banner h2{font-size:22px}.banner em{font-size:13px}
  .drawer{top:auto;width:100%;height:92vh;border-radius:16px 16px 0 0;transform:translateY(100%)}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo"><img src="/img/logo.png" alt="菜园子 原味湘菜"></div>
    <div class="slogan"><b>青菜甜 牛肉香 · 全球华人的家常味</b><span>Greens sweet, beef savory, Global chinese homemade flavor</span></div>
    <button class="cartbtn" onclick="openCart()">🛒 Cart <i id="cnt">0</i> <span id="ctot">$0.00</span></button>
  </div>
  <nav id="nav"></nav>
</header>
<div class="bar">
  <label class="toggle"><input type="checkbox" id="member" style="width:auto"> I'm a member — use <b>MP 会员价</b></label>
  <span class="hours">🕒 Ordering hours: <b>11:30am – 2:30pm</b> · <b>5:30pm – 9:30pm</b> <span id="openpill" class="pill"></span></span>
  <span>Prices in SGD. U.P = regular price.</span>
</div>
<main id="menu"></main>
<footer>
  <div><b>让世界爱上湖南菜</b> · Let the world fall in love with Hunan Cuisine</div>
  <p>118 Killiney Road #01-02, Singapore 239555 · Orders: <a href="tel:+6560419403" style="color:#fff">6041 9403</a></p>
</footer>
<button class="fab hide" id="fab" onclick="openCart()"><span>🛒 <span id="fcnt">0</span> items</span><span>View cart · <span id="ftot">$0.00</span></span></button>

<div id="shell">
  <div class="scrim" onclick="closeCart()"></div>
  <aside class="drawer" aria-label="Cart">
    <div class="dh"><h3 id="dtitle">Your order</h3><button onclick="closeCart()" aria-label="Close">×</button></div>
    <div class="db" id="db"></div>
    <div class="df" id="df"></div>
  </aside>
</div>

<script>
// [id, 中文, English, MP price, U.P price, section, image slug, extra]
const S = {
  sig:  ["招牌必点","Signature Dishes"],
  garden:["菜园子拿手菜","Garden Signature Dish"],
  cold: ["开胃小碟","Pickled & Cold Appetizers"],
  rice: ["经典下饭菜","Classic Rice Dishes"],
  chef: ["大厨精烹","Chef's Exquisite Cuisine"],
  steam:["蒸蒸日上","Steamed Dishes"],
  soup: ["滋补靓汤","Nourishing Soups"],
  veg:  ["我家菜园子","Home Garden Vegetables"],
  dim:  ["老长沙点心","Changsha Dim Sum"],
  drink:["酒水饮料","Beverages"],
};
let M = []; // filled from /api/menu (backend/menu.json) on load

const $=s=>document.querySelector(s), money=n=>"$"+n.toFixed(2);
let byId={};
let member=false, cart={}, optSel={}; // cart key: id|optIndex -> qty
try{cart=JSON.parse(localStorage.getItem("cyz-cart")||"{}");member=localStorage.getItem("cyz-member")==="1"}catch(e){}
$("#member").checked=member;

function unit(key){const [id,o]=key.split("|"),m=byId[id];if(!m)return 0;const ex=m[7]||{};
  const p=ex.opts?ex.opts[+o]:[null,m[3],m[4]];return member?p[1]:p[2]}
function label(key){const [id,o]=key.split("|"),m=byId[id],ex=m[7]||{};return ex.opts?ex.opts[+o][0]:""}
function save(){try{localStorage.setItem("cyz-cart",JSON.stringify(cart));localStorage.setItem("cyz-member",member?"1":"0")}catch(e){}}

function priceHTML(mp,up){return mp===up
  ?`<div class="price member"><span class="mp">$${fmt(up)}</span></div>`
  :`<div class="price ${member?"member":""}"><div><span class="mp">$${fmt(mp)}</span><small>MP会员价</small></div><div class="up">$${fmt(up)}<small>U.P原价</small></div></div>`}
function fmt(n){return (Math.round(n*100)/100).toString()}
function cardHTML(m){const [id,zh,en,mp,up,,img,ex={}]=m,o=optSel[id]||0,p=ex.opts?ex.opts[o]:[0,mp,up];
  return `<article class="card"><div class="ph"><img loading="lazy" src="/img/${img}.jpg" alt="${en}">${ex.badge?`<span class="badge">${ex.badge}</span>`:""}</div>
  <div class="info"><div class="row"><div><div class="zh">${zh}</div><div class="en">${en}</div></div>${priceHTML(p[1],p[2])}</div>
  ${ex.opts?`<div class="opts">${ex.opts.map((x,i)=>`<button class="${i==o?"on":""}" onclick="pickOpt('${id}',${i})">${x[0]}</button>`).join("")}</div>`:""}
  <div class="add"><span class="note">${ex.note||""}</span>${ctrl(id+"|"+(ex.opts?o:0))}</div></div></article>`}
function ctrl(key){const q=cart[key]||0;return q?`<span class="qty"><button onclick="chg('${key}',-1)" aria-label="Remove one">−</button><b>${q}</b><button onclick="chg('${key}',1)" aria-label="Add one">+</button></span>`
  :`<button class="plus" onclick="chg('${key}',1)">+ Add</button>`}

function render(){
  let h="";for(const k in S){const items=M.filter(m=>m[5]===k);
    h+=`<section class="sec" id="s-${k}"><div class="banner"><h2>${S[k][0]}</h2><em>${S[k][1]}</em></div>`;
    if(k==="drink"){const g={};items.forEach(m=>(g[m[7].group]??=[]).push(m));
      h+=`<div class="drinks">${Object.entries(g).map(([n,l])=>`<div class="dcol"><h3>${n}</h3>${l.map(m=>`<div class="drow"><img loading="lazy" src="/img/${m[6]}.jpg" alt=""><div class="t"><b>${m[1]}</b><span class="en">${m[2]}</span></div><span class="p">$${m[4].toFixed(2)}</span>${ctrl(m[0]+"|0")}</div>`).join("")}</div>`).join("")}</div>`}
    else{const hero=items.filter(m=>m[7]?.hero),rest=items.filter(m=>!m[7]?.hero);
      if(hero.length)h+=`<div class="hero">${hero.map(cardHTML).join("")}${rest.slice(0,1).map(cardHTML).join("")}</div>`,rest.shift();
      h+=`<div class="grid">${rest.map(cardHTML).join("")}</div>`}
    h+=`</section>`}
  $("#menu").innerHTML=h;
  $("#nav").innerHTML=Object.entries(S).map(([k,v])=>`<a href="#s-${k}" data-k="${k}">${v[0]}</a>`).join("");
  totals();
  if(window.io)document.querySelectorAll(".sec").forEach(x=>io.observe(x));
}
function pickOpt(id,i){optSel[id]=i;render()}
function chg(key,d){cart[key]=(cart[key]||0)+d;if(cart[key]<=0)delete cart[key];save();render();if(document.body.classList.contains("open")&&step==="cart")drawCart()}
function calc(){let n=0,sub=0;for(const k in cart){if(!byId[k.split("|")[0]]){delete cart[k];continue}n+=cart[k];sub+=cart[k]*unit(k)}
  const svc=orderType==="dine"?sub*.1:0, del=orderType==="delivery"&&sub>0?(sub>=60?0:5):0, gst=(sub+svc+del)*.09;
  return {n,sub,svc,del,gst,total:sub+svc+del+gst}}
function totals(){const c=calc();$("#cnt").textContent=$("#fcnt").textContent=c.n;$("#ctot").textContent=$("#ftot").textContent=money(c.total);$("#fab").classList.toggle("hide",!c.n)}
$("#member").onchange=e=>{member=e.target.checked;save();render()};

// nav highlight
var io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.k===e.target.id.slice(2)))}),{rootMargin:"-140px 0px -60% 0px"});

// ---- cart / checkout ----
let step="cart",orderType="dine",pay="paynow";
const PAYS=[
 ["paynow","PayNow","Pay from any Singapore bank app","#7b2d8e","PN"],
 ["card","Credit / Debit card","Visa · Mastercard · AMEX","#1a3d8f","CARD"],
 ["wallet","Apple Pay / Google Pay","Pay with your phone","#111","PAY"],
 ["grab","GrabPay","Pay with GrabPay wallet","#00b14f","GRAB"],
 ["cash","Cash / NETS at counter","Pay when you collect or after dining","#8a6d1d","$"],
];
function openCart(){step="cart";drawCart();document.body.classList.add("open")}
function closeCart(){document.body.classList.remove("open")}
function sums(c){return `<div class="sum"><span>Subtotal (${member?"member price":"U.P"})</span><span>${money(c.sub)}</span></div>
 ${c.svc?`<div class="sum"><span>Service charge 10%</span><span>${money(c.svc)}</span></div>`:""}
 ${orderType==="delivery"?`<div class="sum"><span>Delivery ${c.sub>=60?"(free over $60)":""}</span><span>${money(c.del)}</span></div>`:""}
 <div class="sum"><span>GST 9%</span><span>${money(c.gst)}</span></div><div class="sum tot"><span>Total</span><span>${money(c.total)}</span></div>`}
function drawCart(){const c=calc(),keys=Object.keys(cart);$("#dtitle").textContent="Your order";
  $("#db").innerHTML=keys.length?keys.map(k=>{const m=byId[k.split("|")[0]];return `<div class="line"><img src="/img/${m[6]}.jpg" alt=""><div class="t"><b>${m[1]} ${label(k)}</b><span class="en">${m[2]}</span><div>${money(unit(k))}</div></div>${ctrl(k)}</div>`}).join("")
   +`<label class="f" for="rem">Notes for the kitchen (spice level, allergies)</label><textarea id="rem" rows="2" placeholder="e.g. less spicy, no coriander">${notes}</textarea>`
   :`<div class="empty">Your cart is empty.<br>Add some Hunan favourites!</div>`;
  $("#df").innerHTML=keys.length?sums(c)+(openWin()?`<button class="big" onclick="toCheckout()">Checkout</button>`:closedHTML()+`<button class="big" disabled>Checkout</button>`):`<button class="big ghost" onclick="closeCart()">Browse menu</button>`;
  const r=$("#rem");if(r)r.oninput=e=>notes=e.target.value}
let notes="",form={name:"",phone:"",table:"",addr:"",time:"asap"};
// ordering hours, Singapore time (minutes after midnight)
const HOURS=[[690,870],[1050,1290]];
const tOverride=new URLSearchParams(location.search).get("now"); // e.g. ?now=15:00 for testing
function sgNow(){if(tOverride){const [h,m]=tOverride.split(":").map(Number);return h*60+m}const d=new Date(Date.now()+8*3600e3);return d.getUTCHours()*60+d.getUTCMinutes()}
function hm(m){const h=Math.floor(m/60),mm=m%60;return `${(h+11)%12+1}:${String(mm).padStart(2,"0")}${h<12?"am":"pm"}`}
function openWin(){const n=sgNow();return HOURS.find(([a,b])=>n>=a&&n<b)}
function nextOpen(){const n=sgNow(),w=HOURS.find(([a])=>a>n);return w?hm(w[0])+" today":hm(HOURS[0][0])+" tomorrow"}
function showHours(){const w=openWin(),el=$("#openpill");el.className="pill"+(w?"":" closed");el.textContent=w?"Open now · until "+hm(w[1]):"Closed · opens "+nextOpen()}
function closedHTML(){return `<div class="closedmsg">Online ordering is closed right now. We take orders 11:30am – 2:30pm and 5:30pm – 9:30pm. Next opening: <b>${nextOpen()}</b>.</div>`}
function toCheckout(){if(!openWin())return drawCart();step="checkout";drawCheckout()}
function drawCheckout(err){const c=calc();$("#dtitle").textContent="Checkout";
  const pm=PAYS.filter(p=>!(p[0]==="cash"&&orderType==="delivery"));if(!pm.find(p=>p[0]===pay))pay="paynow";
  $("#db").innerHTML=`
  <fieldset><legend>Order type</legend><div class="seg">
   ${[["dine","🍽️ Dine-in"],["pickup","🥡 Pickup"],["delivery","🛵 Delivery"]].map(([k,l])=>`<button class="pick ${orderType===k?"on":""}" onclick="setType('${k}')">${l}</button>`).join("")}</div></fieldset>
  <fieldset><legend>Your details</legend>
   <label class="f" for="fn">Name</label><input id="fn" value="${form.name}" autocomplete="name">
   <label class="f" for="fp">Mobile number</label><input id="fp" value="${form.phone}" inputmode="tel" autocomplete="tel" placeholder="8XXX XXXX">
   ${orderType==="dine"?`<label class="f" for="ft">Table number</label><input id="ft" value="${form.table}" inputmode="numeric">`:""}
   ${orderType==="delivery"?`<label class="f" for="fa">Delivery address</label><textarea id="fa" rows="2" autocomplete="street-address">${form.addr}</textarea>`:""}
   ${orderType!=="dine"?`<label class="f" for="fw">${orderType==="pickup"?"Pickup":"Delivery"} time</label><select id="fw"><option value="asap">As soon as possible (about 30 min)</option>${slots().map(s=>`<option ${form.time===s?"selected":""}>${s}</option>`).join("")}</select>`:""}
  </fieldset>
  <fieldset><legend>Payment method</legend><div class="pays">
   ${pm.map(p=>`<button class="pick ${pay===p[0]?"on":""}" onclick="setPay('${p[0]}')"><span class="ic" style="background:${p[3]}">${p[4]}</span><span><b>${p[1]}</b><br><span class="hint">${p[2]}</span></span></button>`).join("")}
  </div>
  </fieldset>${err?`<div class="err">${err}</div>`:""}`;
  $("#df").innerHTML=sums(c)+`<button class="big" onclick="placeOrder()">${pay==="cash"?"Place order":"Pay "+money(c.total)}</button><button class="big ghost" onclick="openCart()">Back to cart</button>`;
  totals()}
function keep(){const v=id=>$(id)?$(id).value:undefined;form.name=v("#fn")??form.name;form.phone=v("#fp")??form.phone;form.table=v("#ft")??form.table;form.addr=v("#fa")??form.addr;form.time=v("#fw")??form.time}
function setType(t){keep();orderType=t;drawCheckout()}
function setPay(p){keep();pay=p;drawCheckout()}
function slots(){const out=[];let t=Math.ceil((sgNow()+30)/15)*15;for(const [a,b] of HOURS){for(let m=Math.max(t,a);m<=b;m+=15)out.push(hm(m))}return out}
function placeOrder(){keep();
  if(!openWin()){step="cart";return drawCart()}
  if(!form.name.trim())return drawCheckout("Please enter your name.");
  if(!/^[689]\d{7}$/.test(form.phone.replace(/\D/g,"").replace(/^65/,"")))return drawCheckout("Please enter a valid Singapore mobile number.");
  if(orderType==="dine"&&!form.table.trim())return drawCheckout("Please enter your table number.");
  if(orderType==="delivery"&&!form.addr.trim())return drawCheckout("Please enter your delivery address.");
  const items=Object.entries(cart).map(([k,qty])=>{const [id,opt]=k.split("|");return {id,opt:+opt,qty}});
  $("#df").innerHTML=`<button class="big" disabled>Sending order…</button>`;
  fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({items,member,type:orderType,
    name:form.name,phone:form.phone,table:form.table,address:form.addr,time:form.time,notes,payment:pay})})
  .then(r=>r.json().then(j=>({ok:r.ok,j}))).then(({ok,j})=>{
    if(!ok)return drawCheckout(j.error||"Something went wrong. Please try again.");
    cart={};notes="";save();totals();
    location.href=j.pay_url||j.status_url})            // provider payment page, or the order status page for cash
  .catch(()=>drawCheckout("Could not reach the restaurant. Check your connection and try again."))}
fetch("/api/menu").then(r=>r.json()).then(j=>{M=j.items.map(m=>[m.id,m.zh,m.en,m.mp,m.up,m.section,m.img,m]);byId=Object.fromEntries(M.map(m=>[m[0],m]));render()});showHours();setInterval(()=>{showHours();if(document.body.classList.contains("open")&&step==="cart")drawCart()},60e3);
</script>
</body>
