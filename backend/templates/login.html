{% extends "base.html" %}
{% block title %}Staff login · 菜园子{% endblock %}
{% block body %}
<form method="post" class="card" style="max-width:360px;margin:60px auto;display:grid;gap:12px">
  <h1 style="margin:0">Staff login</h1>
  <label for="pw" class="muted">Password</label>
  <input type="password" id="pw" name="password" autocomplete="current-password" autofocus required>
  {% if err %}<div style="color:var(--red)">{{ err }}</div>{% endif %}
  <button class="btn">Log in</button>
</form>
{% endblock %}
